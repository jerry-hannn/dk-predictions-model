services:
  dkex:
    build: .
    container_name: dkex-predictions
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/data
      - APP_PASSCODE=${APP_PASSCODE:-}
      - BANKROLL=${BANKROLL:-1000.0}
      - DEFAULT_FEE_DOLLARS=${DEFAULT_FEE_DOLLARS:-0.015}
      - THE_ODDS_API_KEY=${THE_ODDS_API_KEY:-}
    volumes:
      - dkex_data:/data

volumes:
  dkex_data:
